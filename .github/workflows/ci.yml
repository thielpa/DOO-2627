name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: languageduel_friend_challenge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d languageduel_friend_challenge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FRIEND_CHALLENGE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/languageduel_friend_challenge_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
