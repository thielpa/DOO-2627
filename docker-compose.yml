services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: languageduel
      POSTGRES_PASSWORD: languageduel
      POSTGRES_DB: languageduel
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U languageduel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
